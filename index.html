<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="app-version" content="4-standalone">
  <title>台湾旅行チェックリスト</title>
  <style>
:root {
  --bg: #f6f7f8;
  --card: #ffffff;
  --text: #1f2937;
  --muted: #6b7280;
  --border: #e5e7eb;
  --accent: #0f766e;
  --accent-soft: #dff7f3;
  --danger: #b42318;
  --shadow: 0 8px 24px rgba(15, 23, 42, .06);
  --radius: 18px;
}

* { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
               "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
  color: var(--text);
  background: var(--bg);
}

button, input { font: inherit; }

button {
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.app-header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(255, 255, 255, .94);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}

.header-inner {
  max-width: 860px;
  margin: 0 auto;
  padding: 14px 16px 12px;
  display: flex;
  gap: 12px;
  justify-content: space-between;
  align-items: center;
}

.eyebrow {
  margin: 0 0 3px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .12em;
  color: var(--accent);
}

h1 {
  margin: 0;
  font-size: clamp(20px, 5vw, 30px);
  line-height: 1.2;
}

.icon-btn {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--card);
  font-weight: 800;
  color: var(--accent);
}

.container {
  width: min(100% - 24px, 860px);
  margin: 18px auto 40px;
}

.progress-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px;
}

.progress-summary {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 16px;
}

.progress-label {
  display: block;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 2px;
}

#progressText {
  font-size: 20px;
}

#progressPercent {
  font-size: 24px;
  color: var(--accent);
}

.progress-track {
  height: 12px;
  background: #edf0f2;
  border-radius: 999px;
  overflow: hidden;
  margin-top: 12px;
}

.progress-bar {
  width: 0;
  height: 100%;
  background: var(--accent);
  border-radius: inherit;
  transition: width .2s ease;
}

.tabs {
  position: sticky;
  top: 76px;
  z-index: 15;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  padding: 10px 0;
  background: var(--bg);
}

.tab {
  min-height: 44px;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--card);
  color: var(--text);
  font-weight: 700;
}

.tab.active {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 2px 0 12px;
}

.toolbar button {
  min-height: 42px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--card);
  padding: 8px 12px;
  color: var(--text);
}

.toolbar .danger {
  margin-left: auto;
  color: var(--danger);
}

.checklist {
  display: grid;
  gap: 12px;
}

.category {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}

.category-header {
  width: 100%;
  border: 0;
  background: transparent;
  color: inherit;
  padding: 15px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  text-align: left;
}

.category-title {
  font-weight: 800;
  font-size: 16px;
}

.category-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.category-count {
  font-size: 13px;
  font-weight: 700;
  color: var(--accent);
}

.chevron {
  width: 9px;
  height: 9px;
  border-right: 2px solid var(--muted);
  border-bottom: 2px solid var(--muted);
  transform: rotate(45deg);
  transition: transform .15s ease;
  margin-top: -4px;
}

.category.collapsed .chevron {
  transform: rotate(-45deg);
  margin-top: 4px;
}

.category-items {
  border-top: 1px solid var(--border);
}

.category.collapsed .category-items {
  display: none;
}

.check-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  min-height: 52px;
  padding: 12px 16px;
  border-bottom: 1px solid #f0f1f2;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.check-item:last-child {
  border-bottom: 0;
}

.check-item:hover {
  background: #fafafa;
}

.check-item input[type="checkbox"] {
  width: 23px;
  height: 23px;
  margin: 0;
  accent-color: var(--accent);
  flex: 0 0 auto;
}

.check-item span {
  line-height: 1.55;
  word-break: break-word;
}

.check-item.checked span {
  color: #9ca3af;
  text-decoration: line-through;
}

.info-note {
  padding: 12px 16px 14px;
  background: #f9fafb;
  color: #4b5563;
  font-size: 13px;
  line-height: 1.6;
  border-top: 1px dashed var(--border);
}

.empty {
  text-align: center;
  color: var(--muted);
  padding: 40px 20px;
}

.app-footer {
  padding: 0 16px 28px;
  text-align: center;
  color: var(--muted);
  font-size: 12px;
}

dialog {
  width: min(92vw, 480px);
  border: 0;
  border-radius: 18px;
  padding: 0;
  box-shadow: 0 20px 60px rgba(0,0,0,.22);
}

dialog::backdrop {
  background: rgba(0,0,0,.35);
}

.dialog-content {
  padding: 22px;
}

.dialog-content h2 {
  margin-top: 0;
}

.dialog-content button {
  width: 100%;
  min-height: 44px;
  border: 0;
  border-radius: 10px;
  background: var(--accent);
  color: white;
  font-weight: 800;
}

@media (max-width: 560px) {
  .header-inner {
    padding-top: max(12px, env(safe-area-inset-top));
  }

  .tabs {
    top: 72px;
  }

  .toolbar {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }

  .toolbar .danger {
    grid-column: 1 / -1;
    margin-left: 0;
  }

  .category-header {
    padding: 14px;
  }

  .check-item {
    padding: 13px 14px;
  }
}


.toolbar .primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.custom-badge {
  display: inline-block;
  margin-left: 6px;
  padding: 2px 6px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 10px;
  font-weight: 800;
  vertical-align: middle;
}

.check-item .item-text {
  flex: 1;
}

.delete-item-btn,
.delete-category-btn {
  flex: 0 0 auto;
  border: 0;
  background: transparent;
  color: var(--danger);
  min-width: 38px;
  min-height: 38px;
  border-radius: 8px;
  font-size: 18px;
  line-height: 1;
}

.delete-item-btn:hover,
.delete-category-btn:hover {
  background: #fff1f0;
}

.form-label {
  display: block;
  margin: 14px 0 6px;
  font-size: 13px;
  font-weight: 800;
}

.dialog-content input,
.dialog-content select {
  width: 100%;
  min-height: 46px;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 9px 11px;
  background: #fff;
  color: var(--text);
}

.dialog-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 18px;
}

.dialog-actions .secondary {
  background: #eef0f2;
  color: var(--text);
}

@media (max-width: 560px) {
  .toolbar {
    grid-template-columns: 1fr 1fr;
  }

  .toolbar .primary {
    grid-column: auto;
  }

  .toolbar .danger {
    grid-column: 1 / -1;
  }
}

  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div>
        <p class="eyebrow">TAIWAN TRAVEL</p>
        <h1>🇹🇼 台湾旅行チェックリスト</h1>
      </div>
      <button id="installHintBtn" class="icon-btn" type="button" aria-label="使い方">?</button>
    </div>
  </header>

  <main class="container">
    <section class="progress-card" aria-label="進捗">
      <div class="progress-summary">
        <div>
          <span class="progress-label">準備状況</span>
          <strong id="progressText">0 / 0</strong>
        </div>
        <strong id="progressPercent">0%</strong>
      </div>
      <div class="progress-track" aria-hidden="true">
        <div id="progressBar" class="progress-bar"></div>
      </div>
    </section>

    <nav class="tabs" aria-label="チェックリスト切り替え">
      <button class="tab active" data-tab="belongings" type="button">持ち物</button>
      <button class="tab" data-tab="checks" type="button">確認事項</button>
      <button class="tab" data-tab="carryOn" type="button">機内持込</button>
    </nav>

    <section class="toolbar" aria-label="操作">
      <button id="addItemBtn" class="primary" type="button">＋ 項目追加</button>
      <button id="addCategoryBtn" type="button">＋ カテゴリ追加</button>
      <button id="expandAllBtn" type="button">すべて展開</button>
      <button id="collapseAllBtn" type="button">すべて閉じる</button>
      <button id="resetBtn" class="danger" type="button">チェックを全解除</button>
    </section>

    <section id="checklist" class="checklist" aria-live="polite"></section>
  </main>

  <footer class="app-footer">
    <p>チェック状態・追加項目はこの端末のブラウザに保存されます。</p>
    <p style="margin-top:4px">Version 4 Standalone</p>
  </footer>

  <dialog id="helpDialog">
    <div class="dialog-content">
      <h2>使い方</h2>
      <p>項目をタップするとチェックできます。</p>
      <p>「＋ 項目追加」「＋ カテゴリ追加」から自由に追加できます。</p>
      <p>現在は端末ごとの保存です。友達とのリアルタイム同期は次の段階で追加できます。</p>
      <form method="dialog">
        <button type="submit">閉じる</button>
      </form>
    </div>
  </dialog>

  <dialog id="addItemDialog">
    <div class="dialog-content">
      <h2>項目を追加</h2>
      <form id="addItemForm">
        <label class="form-label" for="itemCategorySelect">追加先カテゴリ</label>
        <select id="itemCategorySelect" required></select>

        <label class="form-label" for="itemTextInput">項目名</label>
        <input id="itemTextInput" type="text" maxlength="100" placeholder="例：eSIM（台湾用）" required>

        <div class="dialog-actions">
          <button type="button" class="secondary" data-close-dialog="addItemDialog">キャンセル</button>
          <button type="submit">追加する</button>
        </div>
      </form>
    </div>
  </dialog>

  <dialog id="addCategoryDialog">
    <div class="dialog-content">
      <h2>カテゴリを追加</h2>
      <form id="addCategoryForm">
        <label class="form-label" for="categoryNameInput">カテゴリ名</label>
        <input id="categoryNameInput" type="text" maxlength="60" placeholder="例：お土産・買い物" required>

        <div class="dialog-actions">
          <button type="button" class="secondary" data-close-dialog="addCategoryDialog">キャンセル</button>
          <button type="submit">追加する</button>
        </div>
      </form>
    </div>
  </dialog>

  carryOn: [
    {
      id: "carry-on-main",
      title: "機内持込バッグに入れるもの",
      items: [
        "パスポート",

        "財布",
        "現金",
        "クレジットカード",
        "スマートフォン",

        "モバイルバッテリー",

      ]

  </script>
  <script>
(() => {
  "use strict";

  console.log("Taiwan checklist app v3 loaded");

  const STORAGE_KEY = "taiwan-travel-checklist-v2";
  const COLLAPSE_KEY = "taiwan-travel-checklist-collapse-v2";
  const TAB_KEY = "taiwan-travel-checklist-tab-v1";
  const CUSTOM_KEY = "taiwan-travel-checklist-custom-v1";

  const checklistEl = document.getElementById("checklist");
  const progressTextEl = document.getElementById("progressText");
  const progressPercentEl = document.getElementById("progressPercent");
  const progressBarEl = document.getElementById("progressBar");
  const tabs = Array.from(document.querySelectorAll(".tab"));

  const addItemDialog = document.getElementById("addItemDialog");
  const addCategoryDialog = document.getElementById("addCategoryDialog");
  const itemCategorySelect = document.getElementById("itemCategorySelect");
  const itemTextInput = document.getElementById("itemTextInput");
  const categoryNameInput = document.getElementById("categoryNameInput");

  let activeTab = localStorage.getItem(TAB_KEY) || "belongings";
  let checkedState = loadJson(STORAGE_KEY, {});
  let collapsedState = loadJson(COLLAPSE_KEY, {});
  let customData = loadJson(CUSTOM_KEY, {
    belongings: { categories: [], items: {} },
    checks: { categories: [], items: {} },
    carryOn: { categories: [], items: {} }
  });

  ensureCustomStructure();

  function loadJson(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch {
      return fallback;
    }
  }

  function ensureCustomStructure() {
    ["belongings", "checks", "carryOn"].forEach(tab => {
      if (!customData[tab]) customData[tab] = { categories: [], items: {} };
      if (!Array.isArray(customData[tab].categories)) customData[tab].categories = [];
      if (!customData[tab].items || typeof customData[tab].items !== "object") {
        customData[tab].items = {};
      }
    });
  }

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(checkedState));
  }

  function saveCollapseState() {
    localStorage.setItem(COLLAPSE_KEY, JSON.stringify(collapsedState));
  }

  function saveCustomData() {
    localStorage.setItem(CUSTOM_KEY, JSON.stringify(customData));
  }

  function makeId(prefix) {
    return `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
  }

  function makeBaseItemKey(tab, categoryId, index) {
    return `${tab}:${categoryId}:base:${index}`;
  }

  function makeCustomItemKey(tab, categoryId, itemId) {
    return `${tab}:${categoryId}:custom:${itemId}`;
  }

  function getActiveCategories() {
    const baseCategories = (CHECKLIST_DATA[activeTab] || []).map(category => ({
      ...category,
      custom: false
    }));

    const addedCategories = customData[activeTab].categories.map(category => ({
      id: category.id,
      title: category.title,
      items: [],
      custom: true
    }));

    return [...baseCategories, ...addedCategories];
  }

  function getCategoryItems(category) {
    const result = [];

    (category.items || []).forEach((text, index) => {
      result.push({
        id: `base-${index}`,
        text,
        custom: false,
        key: makeBaseItemKey(activeTab, category.id, index)
      });
    });

    const customItems = customData[activeTab].items[category.id] || [];
    customItems.forEach(item => {
      result.push({
        id: item.id,
        text: item.text,
        custom: true,
        key: makeCustomItemKey(activeTab, category.id, item.id)
      });
    });

    return result;
  }

  function render() {
    tabs.forEach(tab => {
      const selected = tab.dataset.tab === activeTab;
      tab.classList.toggle("active", selected);
      tab.setAttribute("aria-selected", selected ? "true" : "false");
    });

    const categories = getActiveCategories();
    checklistEl.innerHTML = "";

    if (!categories.length) {
      checklistEl.innerHTML = '<div class="empty">項目がありません。</div>';
      updateProgress();
      return;
    }

    categories.forEach(category => {
      const items = getCategoryItems(category);

      const categoryEl = document.createElement("article");
      categoryEl.className = "category";
      categoryEl.dataset.categoryId = category.id;

      if (collapsedState[`${activeTab}:${category.id}`]) {
        categoryEl.classList.add("collapsed");
      }

      const checkedCount = items.reduce((count, item) => {
        return count + (checkedState[item.key] ? 1 : 0);
      }, 0);

      const header = document.createElement("div");
      header.className = "category-header";

      const headerMain = document.createElement("button");
      headerMain.type = "button";
      headerMain.className = "category-header-main";
      headerMain.style.cssText = "border:0;background:transparent;padding:0;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;color:inherit;flex:1;";
      headerMain.innerHTML = `
        <span class="category-title">
          ${escapeHtml(category.title)}
          ${category.custom ? '<span class="custom-badge">追加</span>' : ''}
        </span>
        <span class="category-meta">
          <span class="category-count">${checkedCount}/${items.length}</span>
          <span class="chevron" aria-hidden="true"></span>
        </span>
      `;
      headerMain.addEventListener("click", () => toggleCategory(categoryEl, category.id));

      header.appendChild(headerMain);

      if (category.custom) {
        const deleteCategoryBtn = document.createElement("button");
        deleteCategoryBtn.type = "button";
        deleteCategoryBtn.className = "delete-category-btn";
        deleteCategoryBtn.title = "カテゴリを削除";
        deleteCategoryBtn.setAttribute("aria-label", `${category.title}を削除`);
        deleteCategoryBtn.textContent = "×";
        deleteCategoryBtn.addEventListener("click", () => deleteCustomCategory(category.id, category.title));
        header.appendChild(deleteCategoryBtn);
      }

      const itemsEl = document.createElement("div");
      itemsEl.className = "category-items";

      if (!items.length) {
        const empty = document.createElement("div");
        empty.className = "info-note";
        empty.textContent = "まだ項目がありません。「＋ 項目追加」から追加できます。";
        itemsEl.appendChild(empty);
      }

      items.forEach(item => {
        const label = document.createElement("label");
        label.className = "check-item";
        if (checkedState[item.key]) label.classList.add("checked");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = Boolean(checkedState[item.key]);
        checkbox.addEventListener("change", () => {
          checkedState[item.key] = checkbox.checked;
          saveState();
          render();
        });

        const span = document.createElement("span");
        span.className = "item-text";
        span.textContent = item.text;

        label.append(checkbox, span);

        if (item.custom) {
          const deleteBtn = document.createElement("button");
          deleteBtn.type = "button";
          deleteBtn.className = "delete-item-btn";
          deleteBtn.title = "追加した項目を削除";
          deleteBtn.setAttribute("aria-label", `${item.text}を削除`);
          deleteBtn.textContent = "×";
          deleteBtn.addEventListener("click", event => {
            event.preventDefault();
            event.stopPropagation();
            deleteCustomItem(category.id, item.id, item.text, item.key);
          });
          label.appendChild(deleteBtn);
        }

        itemsEl.appendChild(label);
      });

      if (category.note) {
        const note = document.createElement("div");
        note.className = "info-note";
        note.textContent = category.note;
        itemsEl.appendChild(note);
      }

      categoryEl.append(header, itemsEl);
      checklistEl.appendChild(categoryEl);
    });

    updateProgress();
  }

  function updateProgress() {
    const categories = getActiveCategories();
    let total = 0;
    let checked = 0;

    categories.forEach(category => {
      getCategoryItems(category).forEach(item => {
        total += 1;
        if (checkedState[item.key]) checked += 1;
      });
    });

    const percent = total ? Math.round((checked / total) * 100) : 0;
    progressTextEl.textContent = `${checked} / ${total}`;
    progressPercentEl.textContent = `${percent}%`;
    progressBarEl.style.width = `${percent}%`;
  }

  function toggleCategory(categoryEl, categoryId) {
    const key = `${activeTab}:${categoryId}`;
    const isCollapsed = categoryEl.classList.toggle("collapsed");
    collapsedState[key] = isCollapsed;
    saveCollapseState();
  }

  function setAllCollapsed(value) {
    getActiveCategories().forEach(category => {
      collapsedState[`${activeTab}:${category.id}`] = value;
    });
    saveCollapseState();
    render();
  }

  function resetActiveTab() {
    const ok = window.confirm("このタブのチェックをすべて解除します。よろしいですか？");
    if (!ok) return;

    getActiveCategories().forEach(category => {
      getCategoryItems(category).forEach(item => {
        delete checkedState[item.key];
      });
    });

    saveState();
    render();
  }

  function openAddItemDialog() {
    const categories = getActiveCategories();
    itemCategorySelect.innerHTML = "";

    categories.forEach(category => {
      const option = document.createElement("option");
      option.value = category.id;
      option.textContent = category.title;
      itemCategorySelect.appendChild(option);
    });

    if (!categories.length) {
      alert("先にカテゴリを追加してください。");
      return;
    }

    itemTextInput.value = "";
    addItemDialog.showModal();
    setTimeout(() => itemTextInput.focus(), 50);
  }

  function addCustomItem(categoryId, text) {
    const clean = text.trim();
    if (!clean) return;

    if (!customData[activeTab].items[categoryId]) {
      customData[activeTab].items[categoryId] = [];
    }

    customData[activeTab].items[categoryId].push({
      id: makeId("item"),
      text: clean
    });

    saveCustomData();
    render();
  }

  function addCustomCategory(title) {
    const clean = title.trim();
    if (!clean) return;

    const id = makeId("category");

    customData[activeTab].categories.push({
      id,
      title: clean
    });

    customData[activeTab].items[id] = [];
    saveCustomData();
    render();
  }

  function deleteCustomItem(categoryId, itemId, text, itemKey) {
    if (!window.confirm(`「${text}」を削除しますか？`)) return;

    const list = customData[activeTab].items[categoryId] || [];
    customData[activeTab].items[categoryId] = list.filter(item => item.id !== itemId);

    delete checkedState[itemKey];
    saveState();
    saveCustomData();
    render();
  }

  function deleteCustomCategory(categoryId, title) {
    if (!window.confirm(`カテゴリ「${title}」と、その中の追加項目を削除しますか？`)) return;

    const items = customData[activeTab].items[categoryId] || [];
    items.forEach(item => {
      delete checkedState[makeCustomItemKey(activeTab, categoryId, item.id)];
    });

    customData[activeTab].categories =
      customData[activeTab].categories.filter(category => category.id !== categoryId);

    delete customData[activeTab].items[categoryId];
    delete collapsedState[`${activeTab}:${categoryId}`];

    saveState();
    saveCollapseState();
    saveCustomData();
    render();
  }

  function escapeHtml(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  tabs.forEach(tab => {
    tab.addEventListener("click", () => {
      activeTab = tab.dataset.tab;
      localStorage.setItem(TAB_KEY, activeTab);
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  });

  document.getElementById("addItemBtn").addEventListener("click", openAddItemDialog);
  document.getElementById("addCategoryBtn").addEventListener("click", () => {
    categoryNameInput.value = "";
    addCategoryDialog.showModal();
    setTimeout(() => categoryNameInput.focus(), 50);
  });

  document.getElementById("addItemForm").addEventListener("submit", event => {
    event.preventDefault();
    addCustomItem(itemCategorySelect.value, itemTextInput.value);
    addItemDialog.close();
  });

  document.getElementById("addCategoryForm").addEventListener("submit", event => {
    event.preventDefault();
    addCustomCategory(categoryNameInput.value);
    addCategoryDialog.close();
  });

  document.querySelectorAll("[data-close-dialog]").forEach(button => {
    button.addEventListener("click", () => {
      document.getElementById(button.dataset.closeDialog).close();
    });
  });

  document.getElementById("expandAllBtn").addEventListener("click", () => setAllCollapsed(false));
  document.getElementById("collapseAllBtn").addEventListener("click", () => setAllCollapsed(true));
  document.getElementById("resetBtn").addEventListener("click", resetActiveTab);

  const helpDialog = document.getElementById("helpDialog");
  document.getElementById("installHintBtn").addEventListener("click", () => {
    if (typeof helpDialog.showModal === "function") {
      helpDialog.showModal();
    } else {
      alert("項目をタップするとチェックできます。追加した項目・カテゴリもこの端末に保存されます。");
    }
  });

  render();
})();

  </script>
